  - Fright Checks: docs/expanded/fright.md
  - Interim release notes: docs/releases/character-social-preview.md
  - Library reference: reference/index.md
  - Classes and objects: reference/types.md
  - Functions: reference/functions.md
  - Alphabetical symbols: reference/symbols.md
  - Alphabetical members: reference/members.md
