name: Pre-release reference Pages

on:
  push:
    branches: [pre-release/mundane-rpg, main]
    paths:
      - '.github/workflows/pages.yml'
      - 'README.md'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'dependencies.json'
      - 'docs/**'
      - 'examples/**'
      - 'lib/**'
      - 'tools/build_docs.py'
      - 'tools/docscan.py'
      - 'tests/test_docs.py'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/pre-release/mundane-rpg' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation builder
        run: python -m pip install -r requirements-docs.txt
      - name: Test reference extractor and links
        run: python -m unittest discover -s tests -p test_docs.py
      - name: Build and check reference
        run: python tools/build_docs.py --revision "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reference
        id: deployment
        uses: actions/deploy-pages@v5.0.1
